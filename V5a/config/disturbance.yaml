# Focused disturbance-robustness protocol.
#
# The nominal benchmark uses the disturbance values in config/experiment.yaml.
# Here the current, wind and gust amplitudes are increased by roughly a factor
# of three.  These are still lumped modelling hypotheses, not identified sea
# states.  The same seed produces the same disturbance realisation in every
# condition.
phase: validation
n_seeds: 20

scenarios:
  - open_water
  - coppelia_default
  - single_block
  - offset_goal

dt: 0.05
substeps: 4
smoothing: true
smooth_ds: 0.02
max_path_curvature: 4.0
record_trajectory: false
record_telemetry: false

sensor:
  latency_steps: 2

disturbance:
  enabled: true
  current_speed: 0.050
  current_direction: 0.35
  wind_force: 0.25
  wind_direction: -0.25
  wind_frequency: 0.13
  wave_yaw_amplitude: 0.0060
  wave_frequency: 0.27
  gust_std: 0.050
  gust_time_constant: 1.2

conditions:
  - name: pp
    planner: rrt_star
    planner_options: &rrt
      max_iterations: 2500
      step_size: 0.15
      goal_bias: 0.10
      post_goal_iterations: 300
    controller_options:
      v_max: 0.45

  - name: gs
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 2.0
      zeta: 1.0
      derivative_filter_tau: 0.10

  - name: mrac
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 5.5
      zeta: 1.0
      gamma_psi: 120.0
      gamma_r: 60.0
      gamma_ref: 120.0
      sigma: 1.0e-5

  - name: mrac_lowgain
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 5.5
      zeta: 1.0
      gamma_psi: 120.0
      gamma_r: 60.0
      gamma_ref: 120.0
      sigma: 1.0e-5
