# IARA V4 confirmatory experiment protocol.
#
# Seed pools (disjoint):
#   tune       0..19   -- controller/planner tuning only
#   validation 20..39  -- model selection and sanity checks
#   test       40..89  -- frozen final evaluation only
#
# This file is the validation configuration.  The test configuration must be
# byte-for-byte frozen before the test phase; use scripts/freeze_protocol.py.
#
# Run:
#   python scripts/run_experiment.py --config config/experiment.yaml --phase validation
#   python scripts/freeze_protocol.py --config config/experiment_test.yaml
#   python scripts/run_experiment.py --config config/experiment_test.yaml --phase test --authorize-test
phase: test
n_seeds: 50

# All nine public scenarios are included.  `slalom` is a shared stress case,
# not an exclusion: if every dynamic controller fails it, that is reported.
scenarios:
  - open_water
  - coppelia_default
  - single_block
  - offset_goal
  - slalom
  - u_trap
  - narrow_passage
  - hidden_block
  - coppelia_hidden

dt: 0.05
substeps: 4
smoothing: true
smooth_ds: 0.02
max_path_curvature: 4.0

# The main matrix stores no per-step telemetry; a separate telemetry protocol
# (config/telemetry.yaml) records it for the adaptation figures.
record_trajectory: false
record_telemetry: false

sensor:
  position_std: 0.004
  heading_std: 0.004
  surge_std: 0.008
  sway_std: 0.004
  yaw_rate_std: 0.004
  latency_steps: 2       # 0.10 s at dt = 0.05 s
  dropout_probability: 0.0

# Lumped current/wind/wave disturbance.  Values are modelling hypotheses, not
# identified IARA data.  The stream is paired across conditions.
disturbance:
  enabled: true
  current_speed: 0.018
  current_direction: 0.35
  wind_force: 0.10
  wind_direction: -0.25
  wind_frequency: 0.13
  wave_yaw_amplitude: 0.0025
  wave_frequency: 0.27
  gust_std: 0.02
  gust_time_constant: 1.2

vehicle:
  m_u: 6.0
  m_v: 6.0
  m_r: 0.10
  a_n: 1.6
  b_0: 0.8
  b_n: 3.0
  u_nominal: 1.0
  u_min_effective: 0.02
  d_u_linear: 4.0
  d_u_quadratic: 2.0
  d_v_linear: 12.0
  d_v_quadratic: 4.0
  d_r_quadratic: 0.02
  rudder_max: 0.65

conditions:
  - name: pp
    planner: rrt_star
    planner_options: &rrt
      max_iterations: 2500
      step_size: 0.15
      goal_bias: 0.10
      post_goal_iterations: 300
    controller_options:
      v_max: 0.45
    description: "Pure Pursuit baseline on the 3-DOF plant."

  - name: pd
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      v_max: 0.45
    description: "Cross-track/heading PD baseline on the 3-DOF plant."

  - name: gs
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 2.0
      zeta: 1.0
      derivative_filter_tau: 0.10
    description: "Corrected continuous gain scheduler."

  - name: gs_fixed
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 2.0
      zeta: 1.0
      derivative_filter_tau: 0.10
    description: "Corrected scheduler frozen at the 0.55 m/s design point."

  - name: mrac
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 5.5
      zeta: 1.0
      gamma_psi: 120.0
      gamma_r: 60.0
      gamma_ref: 120.0
      sigma: 1.0e-5
    description: "Adaptive MRAC with projection, sigma-modification and anti-windup."

  - name: mrac_fixed
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 5.5
      zeta: 1.0
      gamma_psi: 120.0
      gamma_r: 60.0
      gamma_ref: 120.0
      sigma: 1.0e-5
    description: "MRAC with adaptation disabled at the matching gains."

  - name: mrac_lowgain
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 5.5
      zeta: 1.0
      gamma_psi: 120.0
      gamma_r: 60.0
      gamma_ref: 120.0
      sigma: 1.0e-5
    description: "Adaptive MRAC starting at 30% of the matching gains."

  - name: mrac_lowgain_fixed
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 5.5
      zeta: 1.0
      gamma_psi: 120.0
      gamma_r: 60.0
      gamma_ref: 120.0
      sigma: 1.0e-5
    description: "Fixed-gain MRAC starting at 30% of the matching gains."

  - name: pp_kinematic
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      v_max: 0.45
    description: "V3 kinematic plant with Pure Pursuit; plant-isolation baseline."

  - name: gs_mismatch
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 2.0
      zeta: 1.0
      derivative_filter_tau: 0.10
    description: "Corrected scheduler with a biased internal yaw model."

  - name: mrac_mismatch
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 5.5
      zeta: 1.0
      gamma_psi: 120.0
      gamma_r: 60.0
      gamma_ref: 120.0
      sigma: 1.0e-5
    description: "Adaptive MRAC with the same biased internal yaw model."

  - name: mrac_fixed_mismatch
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 5.5
      zeta: 1.0
      gamma_psi: 120.0
      gamma_r: 60.0
      gamma_ref: 120.0
      sigma: 1.0e-5
    description: "Fixed-gain MRAC under the biased internal model."

  - name: pp_vfh
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      v_max: 0.45
    local_planner_options: &vfh
      n_sectors: 72
      max_range: 3.0
      slow_distance: 1.00
      speed_cone_distance: 0.80
      slow_cone_half_angle: 1.05
      min_speed_factor: 0.25
    description: "Pure Pursuit plus VFH+ reactive avoidance."

  - name: gs_vfh
    planner: rrt_star
    planner_options: *rrt
    controller_options:
      omega_n: 2.0
      zeta: 1.0
      derivative_filter_tau: 0.10
    local_planner_options: *vfh
    description: "Corrected gain scheduler plus VFH+ reactive avoidance."
